apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// Đọc local.properties để lấy Brevo SMTP config
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

android {
    signingConfigs {
        ubioxiris {
            storeFile file('./keystore/debug.keystore_ubioxPro')
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storePassword 'android'
        }
    }

    compileSdkVersion 34
    defaultConfig {
        applicationId "com.iritech.android.irissample"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 2020126
        versionName "2.0.20126"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        signingConfig signingConfigs.ubioxiris
        
        // Inject Brevo SMTP config từ local.properties vào BuildConfig
        buildConfigField "String", "BREVO_SMTP_KEY", "\"${localProperties.getProperty('brevo.smtp.key', 'YOUR_BREVO_SMTP_KEY')}\""
        buildConfigField "String", "BREVO_SMTP_LOGIN", "\"${localProperties.getProperty('brevo.smtp.login', 'YOUR_BREVO_SMTP_LOGIN')}\""
        buildConfigField "String", "BREVO_SENDER_EMAIL", "\"${localProperties.getProperty('brevo.sender.email', 'YOUR_VERIFIED_SENDER_EMAIL')}\""
        buildConfigField "String", "BREVO_SENDER_NAME", "\"${localProperties.getProperty('brevo.sender.name', 'Iris Sample System')}\""
        externalNativeBuild {
            cmake {
                cppFlags "-frtti -fexceptions"
            }
        }
        ndk {
            // Specifies the ABI configurations of your native
            // libraries Gradle should build and package with your APK.
            abiFilters 'armeabi-v7a', 'arm64-v8a'
            ndkVersion "16.1.4479499"
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.ubioxiris
        }
        debug{
            signingConfig signingConfigs.ubioxiris
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    ndkVersion ndkVersion
    packagingOptions {
        jniLibs {
            keepDebugSymbols += ['**/libmqel_irisreg704.so', '**/libmqel_irisreg704s.so']
        }
        resources {
            excludes += ['META-INF/NOTICE.md', 'META-INF/LICENSE.md', 'META-INF/NOTICE', 'META-INF/LICENSE', 'META-INF/NOTICE.txt', 'META-INF/LICENSE.txt', 'META-INF/DEPENDENCIES']
        }
    }

    // Giải quyết xung đột file META-INF từ JavaMail libraries

    ndkVersion ndkVersion
    buildFeatures {
        compose true
    }
    namespace 'com.iritech.irissample'
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation 'androidx.activity:activity-compose:1.8.0'
    implementation 'androidx.activity:activity-ktx:1.8.0'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation 'androidx.appcompat:appcompat:1.0.2'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation platform('androidx.compose:compose-bom:2023.10.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.1.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.1'
    implementation 'com.google.android.material:material:1.0.0'
    implementation project(path: ':iris')
    implementation project(path: ':iricapture+')
    //implementation project(path: ':mqel_irisreg704')
    //implementation project(path: ':secretkeygenerator')

    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.code.gson:gson:2.2.4'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    implementation 'com.google.code.gson:gson:2.2.4'

    // InstanceID
    implementation 'com.google.android.gms:play-services-gcm:17.0.0'
    implementation 'com.googlecode.json-simple:json-simple:1.1'

    // JavaMail API cho gửi email SMTP
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'
    
    // AndroidX Biometric - Device Lock (PIN/Pattern/Biometric)
    implementation 'androidx.biometric:biometric:1.1.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // 1. Thư viện CameraX (Để mở và quét camera mượt mà)
    def camerax_version = "1.2.2" // (hoặc 1.3.0 tùy bản)
    implementation("androidx.camera:camera-core:${camerax_version}")
    implementation("androidx.camera:camera-camera2:${camerax_version}")
    implementation("androidx.camera:camera-lifecycle:${camerax_version}")
    implementation("androidx.camera:camera-view:${camerax_version}")

    // 2. Thư viện Google ML Kit (Để nhận diện vị trí khuôn mặt)
    implementation("com.google.mlkit:face-detection:16.1.5")

    // 3. Thư viện TensorFlow Lite (Để chạy mô hình so sánh mặt)
    implementation("org.tensorflow:tensorflow-lite:2.9.0")
    implementation("org.tensorflow:tensorflow-lite-support:0.4.1")

    // 4. Thư viện Gson (Để chuyển mảng 192 con số thành chuỗi lưu vào Database)
    implementation("com.google.code.gson:gson:2.10.1")

}
